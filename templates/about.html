{% extends "base.html" %}

{% block main_content %}
<main>
    <article class="about">
        <h1 class="page-header">{{ page.title }}</h1>
        <img class="about-portrait" src="{{ page.extra.portrait }}" alt="Jess Izen" width="240" decoding="async" />
        <p class="about-name"><strong>Jess Izen</strong> <span class="pronouns">(she/her)</span></p>
        <p class="about-socials">
            {% for social in config.extra.socials %}
                <a href="{{ social.url }}" rel="me" class="social">
                    <img src="{{ get_url(path='icons/social/' ~ social.icon ~ '.svg') }}" alt="" width="18" height="18" />
                    <span>{{ social.name }}</span>
                </a>
            {% endfor %}
            <a href="https://rust-lang.org/governance/people/jlizen/" rel="me" class="social">
                <img src="{{ get_url(path='icons/social/rust.svg') }}" alt="" width="18" height="18" />
                <span>RustLang</span>
            </a>
        </p>
        <div class="about-bio">
            {{ page.content | safe }}
        </div>
    </article>
</main>
{% endblock main_content %}
