base_url = "https://blog.jessizen.com"
title = "Jess Izen"
description = "Software engineer at AWS; Engineer in Residence at the Rust Foundation"
author = "Jess Izen"
default_language = "en"
theme = "apollo"
compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [{ name = "tags" }]

[search]
include_title = true
include_description = true
include_path = true
include_content = true
index_format = "elasticlunr_json"

[markdown.highlighting]
style = "class"
light_theme = "catppuccin-latte"
dark_theme = "catppuccin-mocha"

[extra]
theme = "toggle-auto"
use_cdn = false
toc = false
fancy_code = true
dynamic_note = false
mathjax = false
fediverse = false
stylesheets = ["custom.css"]

menu = [
    { name = "Home", url = "/" },
    { name = "Posts", url = "/posts/" },
    { name = "About me", url = "/about/" },
]

socials = [
    { name = "GitHub", url = "https://github.com/jlizen", icon = "github" },
    { name = "LinkedIn", url = "https://www.linkedin.com/in/jess-izen-12085b161/", icon = "linkedin" },
]

[extra.analytics]
enabled = false
