base_url = "https://blog.jessizen.com"
title = "Jess Izen"
description = "Software engineer at AWS; Engineer in Residence at the Rust Foundation"
author = "Jess Izen"
default_language = "en"
theme = "apollo"
compile_sass = true
build_search_index = false
taxonomies = [{ name = "tags" }]

[markdown.highlighting]
style = "class"
light_theme = "catppuccin-latte"
dark_theme = "catppuccin-mocha"

[extra]
theme = "toggle-auto"
use_cdn = false
toc = false
fancy_code = true
dynamic_note = false
mathjax = false
fediverse = false
stylesheets = ["custom.css"]

menu = [
    { name = "Home", url = "/" },
    { name = "Posts", url = "/posts/" },
]

socials = []

[extra.analytics]
enabled = false
